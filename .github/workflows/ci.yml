name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install ruff

      - name: Lint (bug-level rules — blocking)
        run: ruff check --select F82,F63,F7,E9 src/pylometree

      - name: Lint (full rule set — advisory)
        run: ruff check src/pylometree
        continue-on-error: true

      - name: Test
        run: pytest -q
