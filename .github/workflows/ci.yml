name: CI

# Runs on the GitHub mirror only. GitLab CI stays disabled (builds_access_level=disabled):
# its pipeline mail reached the whole team. A failed run here mails only the push actor
# (the mirror token's account). Re-enabled 2026-11-20 (owner).
on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', 'data/input/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build from environment.yml (the documented dev setup, ruff included) so CI cannot
      # drift from it; the package itself goes in editable on top.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install
        shell: micromamba-shell {0}
        run: pip install -e ".[all]"

      - name: Lint (bug-level rules — blocking)
        shell: micromamba-shell {0}
        run: ruff check --select F82,F63,F7,E9 src/pylometree

      - name: Lint (full rule set — advisory)
        shell: micromamba-shell {0}
        run: ruff check src/pylometree
        continue-on-error: true

      - name: Test
        shell: micromamba-shell {0}
        run: pytest -q
