# conda env create -f environment.yml && conda activate pylometree && pip install -e ".[dev]"
name: pylometree
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - pint>=0.21
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff
  - pip